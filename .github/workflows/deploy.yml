name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at the same time.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/antonymuh/personal-crm

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    # Skipped until the server is configured (repository variable DEPLOY_HOST).
    if: vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      SSH_TARGET: ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}
      DEPLOY_DIR: /opt/crm/prod
    steps:
      - uses: actions/checkout@v7

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host deploy-target\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n' \
            "${{ vars.DEPLOY_HOST }}" "${{ vars.DEPLOY_USER }}" > ~/.ssh/config

      - name: Copy deploy scripts
        run: scp deploy/compose.yaml deploy/deploy.sh "deploy-target:$DEPLOY_DIR/"

      - name: Log in to GHCR on the server
        run: echo "${{ secrets.GITHUB_TOKEN }}" | ssh deploy-target "docker login ghcr.io -u ${{ github.actor }} --password-stdin"

      - name: Deploy
        run: ssh deploy-target "bash $DEPLOY_DIR/deploy.sh ${{ github.sha }}"

      - name: Log out of GHCR on the server
        if: always()
        run: ssh deploy-target "docker logout ghcr.io" || true

      - name: Public smoke test
        if: vars.APP_URL != ''
        run: curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "${{ vars.APP_URL }}/health"
