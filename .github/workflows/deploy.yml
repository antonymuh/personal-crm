name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/antonymuh/personal-crm

jobs:
  audit:
    uses: ./.github/workflows/audit.yml

  build:
    needs: audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Every merge goes to the test environment first.
  staging:
    needs: build
    uses: ./.github/workflows/deploy-server.yml
    permissions:
      contents: read
      packages: read
    with:
      environment: staging
      url: https://test-app.pocketcrm.co
      sha: ${{ github.sha }}
    secrets: inherit

  # Production still deploys on every merge, independently of staging.
  prod:
    needs: build
    uses: ./.github/workflows/deploy-server.yml
    permissions:
      contents: read
      packages: read
    with:
      environment: prod
      url: https://app.pocketcrm.co
      sha: ${{ github.sha }}
    secrets: inherit
