name: Deploy prod

# Production is deployed only by hand: Actions -> Deploy prod -> Run workflow.
# - SHA empty: the version of the last green staging deploy.
# - SHA entered: allowed only if that commit has gone green on staging (spare path).
# - Rollback ticked: the prod version before the current one, as remembered by the server;
#   staging is not checked and the SHA field is ignored.
# After a successful deploy, old images are removed from GHCR (the server cleans up itself).
run-name: "Deploy prod: ${{ inputs.rollback && 'rollback to the previous version' || inputs.sha || 'last green staging version' }}"

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA (empty = the last green staging deploy)
        required: false
        type: string
        default: ""
      rollback:
        description: Rollback to the prod version before the current one (SHA is ignored)
        required: false
        type: boolean
        default: false

env:
  IMAGE: ghcr.io/antonymuh/personal-crm
  # Builds (tagged images) kept in GHCR.
  BUILDS_TO_KEEP: 10

jobs:
  resolve:
    name: Pick the version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        if: inputs.rollback

      - name: Set up SSH
        if: inputs.rollback
        uses: ./.github/actions/ssh-setup
        with:
          host: ${{ vars.DEPLOY_HOST }}
          user: ${{ vars.DEPLOY_USER }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      - name: Pick the version
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          ROLLBACK: ${{ inputs.rollback }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          repo="$GITHUB_REPOSITORY"

          # Prints the commit of the first deployment (ids newest first) that went green.
          first_green() {
            local id states
            for id in "$@"; do
              states="$(gh api "repos/$repo/deployments/$id/statuses?per_page=100" --jq '.[].state')"
              if grep -qx success <<< "$states"; then
                gh api "repos/$repo/deployments/$id" --jq .sha
                return 0
              fi
            done
            return 1
          }

          if [ "$ROLLBACK" = "true" ]; then
            sha="$(ssh deploy-target cat /opt/crm/prod/.previous-tag 2>/dev/null || true)"
            if [ -z "$sha" ]; then
              echo "::error::The server has no previous prod version (/opt/crm/prod/.previous-tag)"
              exit 1
            fi
            source="rollback to the prod version before the current one"
          elif [ -z "$INPUT_SHA" ]; then
            mapfile -t ids < <(gh api "repos/$repo/deployments?environment=staging&per_page=100" --jq '.[].id')
            if ! sha="$(first_green "${ids[@]}")"; then
              echo "::error::No green staging deploy found"
              exit 1
            fi
            source="the last green staging deploy"
          else
            if ! [[ "$INPUT_SHA" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
              echo "::error::'$INPUT_SHA' is not a commit SHA"
              exit 1
            fi
            if ! full="$(gh api "repos/$repo/commits/$INPUT_SHA" --jq .sha)"; then
              echo "::error::Commit $INPUT_SHA not found"
              exit 1
            fi
            mapfile -t ids < <(gh api "repos/$repo/deployments?environment=staging&sha=$full&per_page=100" --jq '.[].id')
            if ! sha="$(first_green "${ids[@]}")"; then
              echo "::error::$full has never gone green on staging; only versions that passed staging go to prod"
              exit 1
            fi
            source="entered by hand, passed staging"
          fi

          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unexpected version '$sha'"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          {
            echo "### Deploy prod"
            echo
            echo "- Version: [\`$sha\`](https://github.com/$repo/commit/$sha)"
            echo "- Chosen: $source"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: resolve
    uses: ./.github/workflows/deploy-server.yml
    permissions:
      contents: read
      packages: read
    with:
      environment: prod
      url: https://app.pocketcrm.co
      sha: ${{ needs.resolve.outputs.sha }}
    secrets: inherit

  cleanup:
    name: Remove old builds from GHCR
    needs: [resolve, deploy]
    runs-on: ubuntu-latest
    concurrency:
      group: ghcr-cleanup
      cancel-in-progress: false
    permissions:
      packages: write
    steps:
      - name: Summary
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          echo "- Deployed to prod: \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A build is a tagged image index; its platform image and attestation are separate
      # untagged versions in GHCR. Keep the newest builds together with what they reference,
      # delete everything older than the oldest kept build.
      - name: Keep the ${{ env.BUILDS_TO_KEEP }} newest builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${IMAGE##*/}/versions"
          gh api --paginate "$api?per_page=100" \
            --jq '.[] | {id, name, created_at, tags: .metadata.container.tags}' |
            jq -s 'sort_by(.created_at) | reverse' > versions.json

          jq -r --argjson n "$BUILDS_TO_KEEP" '[.[] | select(.tags | length > 0)][:$n][] | .tags[0]' versions.json > kept-tags
          if [ "$(wc -l < kept-tags)" -lt "$BUILDS_TO_KEEP" ]; then
            echo "Fewer than $BUILDS_TO_KEEP builds in GHCR, nothing to remove"
            exit 0
          fi
          oldest_kept="$(jq -r --arg t "$(tail -n 1 kept-tags)" '.[] | select(.tags | index($t)) | .created_at' versions.json)"

          : > keep
          while read -r tag; do
            jq -r --arg t "$tag" '.[] | select(.tags | index($t)) | .name' versions.json >> keep
            docker buildx imagetools inspect --raw "$IMAGE:$tag" | jq -r '.manifests[]?.digest' >> keep
          done < kept-tags

          jq -r --arg before "$oldest_kept" --rawfile keep keep \
            '.[] | select(.created_at < $before) | select(.name as $d | ($keep | split("\n") | index($d)) | not) | "\(.id) \(.name) \(.tags | join(","))"' \
            versions.json > to-delete

          echo "Removing $(wc -l < to-delete) old versions"
          while read -r id name tags; do
            echo "  $name ${tags:-(untagged)}"
            gh api -X DELETE "$api/$id" --silent
          done < to-delete
