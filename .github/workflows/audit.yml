name: Security audit

on:
  pull_request:
  # Called from deploy.yml before the image is built.
  workflow_call:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.14.0
      # Fails on high or critical vulnerabilities in production dependencies.
      - run: pnpm audit --prod --audit-level high --ignore-registry-errors
