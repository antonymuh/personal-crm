services:
  db:
    image: postgres:17-alpine
    container_name: personal-crm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm
      # Read from .env; compose refuses to start if it is missing.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: personal_crm
    ports:
      - "5432:5432"
    volumes:
      - crm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d personal_crm"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches every email the app sends locally and in tests; nothing reaches real inboxes.
  # Web UI with the caught emails: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.33
    container_name: personal-crm-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  crm_pgdata:
