# Test environment (staging): https://test-app.pocketcrm.co -> the staging app on 127.0.0.1:3001.
# Kept in the repo for history; installed by hand to /etc/nginx/sites-available/ (see README).
# Staging holds a copy of production data, so the whole site is behind a password,
# except /health for the smoke test from GitHub Actions.

server {
    server_name test-app.pocketcrm.co;

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/test-app.pocketcrm.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test-app.pocketcrm.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    auth_basic "PocketCRM staging";
    auth_basic_user_file /etc/nginx/test-app.pocketcrm.co.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        auth_basic off;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
    }

    # While the app container is not running, show the placeholder (status stays 502).
    error_page 502 503 504 /placeholder.html;
    location = /placeholder.html {
        root /var/www/pocketcrm-placeholder;
        internal;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name test-app.pocketcrm.co;
    return 301 https://$host$request_uri;
}
