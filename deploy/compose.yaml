# The app stack on the server, the same file for prod and staging.
# Lives in /opt/crm/<env> next to that environment's .env.
# Always run through the deploy scripts: docker compose -p <env> -f compose.yaml,
# with APP_PORT set by lib.sh (prod 3000, staging 3001).

# Logs go to the server journal (journald): they survive container recreation on deploy and rollback.
# The journal size is limited by the system (journald defaults), not here.
x-logging: &logging
  driver: journald
  options:
    # SYSLOG_IDENTIFIER = container name: prod-app-1, staging-db-1, ...
    tag: "{{.Name}}"
    # Adds COM_DOCKER_COMPOSE_PROJECT and COM_DOCKER_COMPOSE_SERVICE fields to filter by environment
    # and service (the one-off migrate container gets a new name on every run).
    labels: com.docker.compose.project,com.docker.compose.service

x-app-image: &app-image ghcr.io/antonymuh/personal-crm:${IMAGE_TAG:?IMAGE_TAG is not set}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    # Two environments share one server: neither may take all its memory.
    mem_limit: 512m
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: personal_crm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d personal_crm"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  # One-off container from the same image: applies migrations and exits.
  migrate:
    image: *app-image
    profiles: ["migrate"]
    mem_limit: 512m
    env_file: .env
    command: ["node", "migrator/migrate.mjs"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging: *logging

  app:
    image: *app-image
    restart: unless-stopped
    mem_limit: 512m
    env_file: .env
    # Only reachable from the server itself; nginx proxies the public traffic.
    ports:
      - "127.0.0.1:${APP_PORT:?APP_PORT is not set}:3000"
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

volumes:
  pgdata:
